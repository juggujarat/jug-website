<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="icon" href="/jug-logo.ico" type="image/x-icon" />

    <!--
      Neutral site-wide defaults (values mirror src/content/site.js), used by the
      dev server and any page served without prerendering. scripts/prerender.mjs
      strips the default title and every data-rh="true" tag from the built template and
      injects each page's own from components/Seo.jsx. og:* use `property`,
      twitter:* use `name`.
    -->
    <title>Gujarat JUG - Official Community Page</title>
    <meta data-rh="true" name="description" content="Gujarat Java User Group (JUG) is a thriving community of Java developers, tech enthusiasts, and industry professionals. Join us to learn, network, and grow!" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="Gujarat Java User Group" />
    <meta data-rh="true" property="og:title" content="Gujarat JUG - Official Community Page" />
    <meta data-rh="true" property="og:description" content="Gujarat Java User Group (JUG) is a thriving community of Java developers, tech enthusiasts, and industry professionals. Join us to learn, network, and grow!" />
    <meta data-rh="true" property="og:image" content="https://www.gujaratjug.org/Img/AboutCommunity.png" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="Gujarat JUG - Official Community Page" />
    <meta data-rh="true" name="twitter:description" content="Gujarat Java User Group (JUG) is a thriving community of Java developers, tech enthusiasts, and industry professionals. Join us to learn, network, and grow!" />
    <meta data-rh="true" name="twitter:image" content="https://www.gujaratjug.org/Img/AboutCommunity.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
